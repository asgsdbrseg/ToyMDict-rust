[package]
name = "toymdict"
version = "1.0.0"
description = "ToyMDict - MDict 词典阅读器（Rust + Tauri 重构版）"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "toymdict"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools：让 release 构建也具备打开 DevTools 的能力（不等于启动时自动打开）。
# 是否打开由用户按 F12 / Ctrl+Shift+I 触发，setup 里不调用 open_devtools()。
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# IndexMap 保留 dict_groups.json 里分组的写入顺序（BTreeMap 会按 key 重排）
indexmap = { version = "2", features = ["serde"] }
mdx = { path = "../vendor/mdx", features = ["icu"] }
regex = "1"
# 高级搜索用：regex crate 不支持反向引用/环视，fancy-regex 支持且兼容常见语法。
# 普通搜索仍用 regex（更快），高级搜索专用 fancy_regex::Regex。
fancy-regex = "0.14"
url = "2"
uuid = { version = "1", features = ["v4"] }
rayon = "1"
parking_lot = "0.12"
once_cell = "1"
mime_guess = "2"
percent-encoding = "2"

# 系统级全局快捷键（双击 Ctrl 取词）只依赖 Windows 系统 DLL，
# 用 windows-sys 而不是引入额外插件，保持单文件 exe 无附带 DLL。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
